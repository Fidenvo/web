<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Học trực tuyến Công nghệ thông tin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; font-size: 14px; }

    .container {
      display: flex;
      min-height: 100vh;
    }

    nav {
      width: 160px;
      background-color: #c0c0c0;
      padding: 0;
    }

    nav ul {
      list-style: none;
    }

    nav ul li a {
      display: block;
      padding: 8px 12px;
      text-decoration: none;
      color: black;
    }

    nav ul li:first-child {
      background-color: #555;
    }

    nav ul li:first-child a {
      color: white;
      font-weight: bold;
    }

    nav ul li a:hover {
      background-color: #aaa;
    }

    main {
      flex: 1;
      padding: 20px 30px;
    }

    main h1 {
      font-size: 20px;
      margin-bottom: 16px;
    }

    main h2 {
      font-size: 15px;
      margin-bottom: 8px;
    }

    main ol {
      margin-left: 24px;
    }

    main ol li {
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <nav>
      <ul>
        <li><a href="#">Trang chủ</a></li>
        <li><a href="#">Khóa học</a></li>
        <li><a href="#">Diễn đàn</a></li>
        <li><a href="#">Liên hệ</a></li>
      </ul>
    </nav>

    <main>
      <h1>Học trực tuyến Công nghệ thông tin</h1>
      <h2>Các khóa học:</h2>
      <ol>
        <li>Lập trình cơ bản</li>
        <li>Cấu trúc dữ liệu</li>
        <li>Thiết kế web</li>
      </ol>
    </main>
  </div>
</body>
</html>
