<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Học trực tuyến Công nghệ thông tin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; font-size: 15px; display: flex; min-height: 100vh; }

    nav {
      width: 180px;
      background-color: #b0b0b0;
      flex-shrink: 0;
    }

    nav ul {
      list-style: none;
    }

    nav ul li a {
      display: block;
      padding: 12px 16px;
      text-decoration: none;
      color: black;
    }

    nav ul li:first-child {
      background-color: #555;
    }

    nav ul li:first-child a {
      color: white;
      font-weight: bold;
    }

    nav ul li a:hover {
      background-color: #999;
    }

    main {
      flex: 1;
      padding: 40px 50px;
      background-color: white;
      border: 1px solid #ddd;
      margin: 20px;
      border-radius: 4px;
      max-width: 700px;
      align-self: flex-start;
    }

    main h1 {
      font-size: 22px;
      margin-bottom: 20px;
      border-bottom: 1px solid #eee;
      padding-bottom: 10px;
    }

    main h2 {
      font-size: 15px;
      margin-bottom: 10px;
    }

    main ol {
      margin-left: 28px;
      line-height: 2;
    }
  </style>
</head>
<body>

  <nav>
    <ul>
      <li><a href="#">Trang chủ</a></li>
      <li><a href="#">Khóa học</a></li>
      <li><a href="#">Diễn đàn</a></li>
      <li><a href="#">Liên hệ</a></li>
    </ul>
  </nav>

  <main>
    <h1>Học trực tuyến Công nghệ thông tin</h1>
    <h2>Các khóa học:</h2>
    <ol>
      <li>Lập trình cơ bản</li>
      <li>Cấu trúc dữ liệu</li>
      <li>Thiết kế web</li>
    </ol>
  </main>

</body>
</html>
